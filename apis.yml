aid: jmem
name: JMEM
description: 'JMEM (Jmem Tek) is an upstream semiconductor company specializing in
  Application-Specific Integrated Circuit (ASIC) solutions for quantum-resilient cybersecurity.
  The company designs hardware security intellectual property and provides IC design
  services, offering products such as JRoot, JPUF, JCrypt, and JShield, along with
  Zanker, described as the world''s first PUF-based post-quantum cryptography (PQC)
  chip. Its NIST-aligned, quantum-safe encryption and hardware-anchored identity authentication
  protect chips against counterfeiting and unauthorized modification across UAV, automotive,
  surveillance, and fintech applications. JMEM is a portfolio company of 500 Global,
  added to the API Evangelist network and enriched from its public web presence; it
  publishes no public API or developer surface at this time.'
